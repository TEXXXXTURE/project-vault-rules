<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8a8f98"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#f7f8fa"/>
  <text x="60" y="44" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#1f2328">单人版项目管理规则 · PROJECT VAULT</text>
  <text x="60" y="68" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="14" fill="#57606a">需求 → 规划 → 评审 → 执行 → 验证 → 复盘 · 决策/问题贯穿 · 理念是仲裁标准</text>

  <!-- 理念纲领层 -->
  <rect x="160" y="96" width="880" height="64" rx="10" fill="#fdf3d7" stroke="#e3c565" stroke-width="1.5"/>
  <text x="180" y="124" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#8a6d1a">纲领 · 项目理念（PRD 开篇）</text>
  <text x="180" y="146" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#8a6d1a">产品是什么 · 为谁 · 什么优先 → 所有决策/ADR 向它对齐</text>

  <!-- 主流程：6 环节 -->
  <g font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
    <!-- 01 需求 -->
    <rect x="60"  y="220" width="150" height="92" rx="8" fill="#dbeafe" stroke="#7aa7e8" stroke-width="1.5"/>
    <text x="135" y="248" font-size="13" font-weight="700" fill="#1e4f9e" text-anchor="middle">01 · 需求与PRD</text>
    <text x="135" y="270" font-size="12" fill="#3b5b8f" text-anchor="middle">理念 + FR/NFR</text>
    <text x="135" y="294" font-size="11" fill="#57606a" text-anchor="middle">PRD.md</text>
    <line x1="210" y1="266" x2="248" y2="266" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 02 规划 -->
    <rect x="250" y="220" width="150" height="92" rx="8" fill="#dbeafe" stroke="#7aa7e8" stroke-width="1.5"/>
    <text x="325" y="248" font-size="13" font-weight="700" fill="#1e4f9e" text-anchor="middle">02 · 计划与方案</text>
    <text x="325" y="270" font-size="12" fill="#3b5b8f" text-anchor="middle">拆解 · 排期</text>
    <text x="325" y="294" font-size="11" fill="#57606a" text-anchor="middle">计划与方案.md</text>
    <line x1="400" y1="266" x2="438" y2="266" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 03 评审 -->
    <rect x="440" y="220" width="150" height="92" rx="8" fill="#ffe8cc" stroke="#f0b37e" stroke-width="1.5"/>
    <text x="515" y="248" font-size="13" font-weight="700" fill="#a36a1e" text-anchor="middle">03 · 评审意见</text>
    <text x="515" y="270" font-size="12" fill="#a36a1e" text-anchor="middle">无记忆 Agent</text>
    <text x="515" y="294" font-size="11" fill="#57606a" text-anchor="middle">评审意见.md</text>
    <line x1="590" y1="266" x2="628" y2="266" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 04 执行 -->
    <rect x="630" y="220" width="150" height="92" rx="8" fill="#dbeafe" stroke="#7aa7e8" stroke-width="1.5"/>
    <text x="705" y="248" font-size="13" font-weight="700" fill="#1e4f9e" text-anchor="middle">04 · 执行状态</text>
    <text x="705" y="270" font-size="12" fill="#3b5b8f" text-anchor="middle">产物留产品仓</text>
    <text x="705" y="294" font-size="11" fill="#57606a" text-anchor="middle">状态记录.md</text>
    <line x1="780" y1="266" x2="818" y2="266" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 05 验证 -->
    <rect x="820" y="220" width="150" height="92" rx="8" fill="#dbeafe" stroke="#7aa7e8" stroke-width="1.5"/>
    <text x="895" y="248" font-size="13" font-weight="700" fill="#1e4f9e" text-anchor="middle">05 · 验证记录</text>
    <text x="895" y="270" font-size="12" fill="#3b5b8f" text-anchor="middle">测试 · 问题清单</text>
    <text x="895" y="294" font-size="11" fill="#57606a" text-anchor="middle">测试记录.md</text>
    <line x1="970" y1="266" x2="1008" y2="266" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 06 复盘 -->
    <rect x="1010" y="220" width="130" height="92" rx="8" fill="#dbeafe" stroke="#7aa7e8" stroke-width="1.5"/>
    <text x="1075" y="248" font-size="13" font-weight="700" fill="#1e4f9e" text-anchor="middle">06 · 复盘</text>
    <text x="1075" y="270" font-size="12" fill="#3b5b8f" text-anchor="middle">教训 · 归档</text>
    <text x="1075" y="294" font-size="11" fill="#57606a" text-anchor="middle">复盘.md</text>
  </g>

  <!-- 评审注记 -->
  <text x="515" y="336" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#a36a1e" text-anchor="middle">评审者不带项目上下文，模拟外部专家挑盲区</text>

  <!-- 贯穿：决策 / 问题 -->
  <g font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
    <rect x="220" y="420" width="330" height="88" rx="10" fill="#ffffff" stroke="#8cc9a2" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="240" y="452" font-size="15" font-weight="700" fill="#1f7a38">贯穿 · 决策（ADR）</text>
    <text x="240" y="476" font-size="13" fill="#57606a">关键选择留痕 · 变更不覆盖 · 引用理念</text>
    <text x="240" y="496" font-size="12" fill="#8a8f98">决策/ADR-0001-xxx.md</text>

    <rect x="650" y="420" width="330" height="88" rx="10" fill="#ffffff" stroke="#c9a06b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="670" y="452" font-size="15" font-weight="700" fill="#8a6d1a">贯穿 · 问题（debug）</text>
    <text x="670" y="476" font-size="13" fill="#57606a">任何阶段踩的坑 · 根因 · 修复 · 教训</text>
    <text x="670" y="496" font-size="12" fill="#8a8f98">问题/debug-log.md</text>

    <line x1="385" y1="312" x2="385" y2="420" stroke="#8cc9a2" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="815" y1="312" x2="815" y2="420" stroke="#c9a06b" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 边界：产品仓 vs 总仓 -->
  <g font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
    <rect x="220" y="560" width="760" height="86" rx="10" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/>
    <text x="240" y="588" font-size="14" font-weight="700" fill="#1f2328">边界 · 两类内容物理隔离</text>
    <text x="240" y="612" font-size="13" fill="#57606a">产品仓 = 作品（代码 / 成品 / 完整 PRD）</text>
    <text x="240" y="632" font-size="13" fill="#57606a">总仓 = 档案（PRD 摘要 · 评审 · 决策 · 问题 · 复盘），只记 origin 指针</text>
  </g>
</svg>
